# Runs when a version tag is pushed. Publishes exactly the files CI tested:
# the dist branch is what `Library: Install` reads, and the release holds a zip for manual installs.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plug
          path: ${{ runner.temp }}/plug
      - name: Publish
        run: scripts/publish.sh "$RUNNER_TEMP/plug"
        env:
          GH_TOKEN: ${{ github.token }}
